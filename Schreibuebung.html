<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Schreibübung – Saarland Grundschule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
/* Noto Sans: aufrechte, klare serifenlose Druckschrift – entspricht der
   saarländischen Grundschul-Druckschrift (Lateinische Ausgangsschrift / Grundschrift) */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');

:root {
  --bg:      #f2f6fd;
  --paper:   #fffef9;
  --ink:     #1a2e4a;
  --accent:  #2563eb;
  --green:   #16a34a;
  --red:     #dc2626;
  --amber:   #d97706;
  --shadow:  rgba(30,60,120,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 14px 52px;
  min-height: 100vh;
  overscroll-behavior: none;
}

header {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 860px; margin-bottom: 20px;
}
.logo {
  width: 44px; height: 44px; border-radius: 13px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
  box-shadow: 0 3px 12px rgba(37,99,235,0.28);
}
h1 { font-size: 1.5rem; font-weight: 800; color: var(--ink); }
h1 em { color: var(--accent); font-style: normal; }

/* Progress */
.prog-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; max-width: 860px; margin-bottom: 16px;
}
.prog-track { flex:1; height:7px; background:#dde8f8; border-radius:99px; overflow:hidden; }
.prog-fill  { height:100%; background:linear-gradient(90deg,var(--accent),#06b6d4); border-radius:99px; transition:width .5s ease; width:0%; }
.prog-label { font-size:.78rem; font-weight:700; color:#7a90b0; white-space:nowrap; }

/* Card */
.card {
  background: var(--paper);
  border-radius: 18px;
  box-shadow: 0 4px 24px var(--shadow);
  padding: 20px 22px 18px;
  width: 100%; max-width: 860px;
  margin-bottom: 16px;
}
.card-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.4px; color: #90a4be; margin-bottom: 10px;
}

/* ── Vorgabe-Satz: saarländische Druckschrift auf Linien ── */
.vorgabe-outer {
  position: relative;
  background: #f7fbff;
  border-radius: 12px;
  border-left: 4px solid var(--accent);
  overflow: hidden;
  /* Höhe wird per JS gesetzt nachdem Text gerendert */
}
.vorgabe-canvas {
  display: block;
  width: 100%;
  /* Höhe via JS */
}

/* ── Schreibbereich ── */
.tool-row {
  display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;
}
.tool-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#90a4be; }
.sz {
  width:34px; height:34px; border-radius:50%;
  border:2px solid #d0ddf0; background:#f2f6fd;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .15s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.sz.on { border-color:var(--accent); background:#eff6ff; }
.dot { background:#1a2e4a; border-radius:50%; pointer-events:none; }

.canvas-wrap {
  position: relative;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1.5px solid #dde8f8;
  background: var(--paper);
  /* KRITISCH: touch-action none damit Apple Pencil-Events nicht vom System
     als Scroll interpretiert werden */
  touch-action: none;
  -webkit-touch-action: none;
  cursor: crosshair;
}
#bgCanvas   { display:block; width:100%; position:absolute; top:0; left:0; pointer-events:none; z-index:1; }
#drawCanvas { display:block; width:100%; position:relative; z-index:2;
              touch-action:none; -webkit-touch-action:none; }

.hint {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:.92rem; font-weight:600; color:#c0d0e4;
  pointer-events:none; z-index:3;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}

/* Buttons */
.btn-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.btn {
  flex:1; min-width:110px; padding:13px 16px;
  border-radius:13px; border:none;
  font-family:'Nunito',sans-serif; font-size:.95rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:7px;
  cursor:pointer; transition:transform .1s, filter .1s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.btn:active { transform:scale(.95); }
.btn-clear { background:#eef2fa; color:#5a6a80; }
.btn-check { background:var(--accent); color:#fff; box-shadow:0 3px 14px rgba(37,99,235,.28); }
.btn-next  { background:var(--green);  color:#fff; box-shadow:0 3px 14px rgba(22,163,74,.25); }

/* Ergebnis */
.result-card {
  background:var(--paper); border-radius:18px; box-shadow:0 4px 24px var(--shadow);
  padding:22px 24px; width:100%; max-width:860px; margin-bottom:16px;
  display:none; animation:pop .32s cubic-bezier(.22,1,.36,1);
}
@keyframes pop { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.score-row { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.score-badge {
  width:66px; height:66px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.55rem; font-weight:800; flex-shrink:0;
}
.s-great{background:#dcfce7;color:var(--green);}
.s-ok   {background:#fef9c3;color:var(--amber);}
.s-low  {background:#fee2e2;color:var(--red);}
.score-text h2{font-size:1.18rem;font-weight:800;color:var(--ink);}
.score-text p {font-size:.87rem;color:#7a90b0;margin-top:2px;}

.fb-list{list-style:none;display:flex;flex-direction:column;gap:7px;}
.fb-item{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-radius:10px;font-size:.92rem;}
.fb-ok  {background:#f0fdf4;color:#166534;}
.fb-warn{background:#fefce8;color:#854d0e;}
.fb-err {background:#fef2f2;color:#991b1b;}
.fb-ico {font-size:1rem;flex-shrink:0;margin-top:1px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<header>
  <div class="logo">✏️</div>
  <h1>Schreib<em>übung</em></h1>
</header>

<div class="prog-row">
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <span class="prog-label" id="progLabel">0 / 10</span>
</div>

<!-- Vorgabe-Satz -->
<div class="card">
  <div class="card-label">✦ Schreibe diesen Satz nach</div>
  <div class="vorgabe-outer" id="vorgabeOuter">
    <canvas id="vorgabeCanvas" class="vorgabe-canvas"></canvas>
  </div>
</div>

<!-- Schreiben -->
<div class="card">
  <div class="card-label">✦ Hier mit dem Apple Pencil schreiben</div>
  <div class="tool-row">
    <span class="tool-label">Stärke</span>
    <button class="sz"    data-s="2"   onclick="setPen(2)"  ><span class="dot" style="width:4px;height:4px"></span></button>
    <button class="sz on" data-s="4"   onclick="setPen(4)"  ><span class="dot" style="width:8px;height:8px"></span></button>
    <button class="sz"    data-s="6.5" onclick="setPen(6.5)"><span class="dot" style="width:13px;height:13px"></span></button>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <div class="hint" id="hint">✏️&nbsp; Hier schreiben</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-clear" onclick="clearDraw()">🗑 Löschen</button>
    <button class="btn btn-check" id="checkBtn" onclick="checkWriting()">🔍 Überprüfen</button>
  </div>
</div>

<!-- Ergebnis -->
<div class="result-card" id="resultCard">
  <div class="card-label">✦ Auswertung</div>
  <div class="score-row">
    <div class="score-badge" id="scoreBadge">?</div>
    <div class="score-text"><h2 id="scoreTitle"></h2><p id="scoreSub"></p></div>
  </div>
  <ul class="fb-list" id="fbList"></ul>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn btn-next" onclick="nextSentence()">➡ Nächster Satz</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   SÄTZE – Grundschulniveau
══════════════════════════════════════════════════ */
const SAETZE = [
  "Die Katze sitzt auf der Mauer.",
  "Der Hund bellt laut im Garten.",
  "Wir gehen heute in die Schule.",
  "Das Kind malt ein buntes Bild.",
  "Die Sonne scheint hell am Himmel.",
  "Mama kauft frisches Brot beim Bäcker.",
  "Der Zug fährt durch den langen Tunnel.",
  "Heute ist Mittwoch und wir haben Sport.",
  "Die Blumen im Garten duften sehr schön.",
  "Mein Bruder liest ein spannendes Buch.",
  "Die Vögel singen morgens im Baum.",
  "Wir trinken Kakao und essen Kekse.",
  "Das Fußballspiel beginnt um drei Uhr.",
  "Im Winter liegt Schnee auf den Feldern.",
  "Opa und Oma besuchen uns am Samstag.",
];

let satzIdx   = 0;
let doneCount = 0;
let penSize   = 4;
let drawing   = false;
let hasContent = false;
let lastX = 0, lastY = 0, lastPressure = 0.5;

/* ── Offscreen-Canvas: speichert alle Striche persistent ── */
const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d');

const bgC  = document.getElementById('bgCanvas');
const bgX  = bgC.getContext('2d');
const drC  = document.getElementById('drawCanvas');
const drX  = drC.getContext('2d');
const wrap = document.getElementById('canvasWrap');

const ROWS   = 3;
const ROW_H  = 82;
const PAD    = 12;
const dpr    = window.devicePixelRatio || 1;

/* ── Canvas initialisieren / Resize ── */
function initCanvases() {
  const W = wrap.clientWidth;
  const H = ROW_H * ROWS + PAD * 2;
  const pw = Math.round(W * dpr);
  const ph = Math.round(H * dpr);

  [bgC, drC].forEach(c => {
    c.width  = pw; c.height = ph;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  offscreen.width  = pw;
  offscreen.height = ph;

  // Contexts neu skalieren
  [bgX, drX, offCtx].forEach(cx => {
    cx.setTransform(1,0,0,1,0,0);
    cx.scale(dpr, dpr);
  });

  drawLines(bgX, W, H);
  repaintDraw(W, H);
}

function drawLines(ctx, W, H) {
  ctx.clearRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++) {
    const y0 = PAD + r * ROW_H;
    // Oberlinie (hellblau)
    hline(ctx, y0 + ROW_H * 0.06, W, 'rgba(100,160,225,0.55)', 1.0);
    // Mittellinie gestrichelt
    hlineDash(ctx, y0 + ROW_H * 0.40, W, 'rgba(100,160,225,0.28)', 0.8);
    // Grundlinie (orange – Schreiblinie)
    hline(ctx, y0 + ROW_H * 0.68, W, 'rgba(210,130,55,0.85)', 3.0);
    // Unterlinie
    hline(ctx, y0 + ROW_H * 0.93, W, 'rgba(100,160,225,0.32)', 0.8);
  }
}

function hline(ctx, y, W, color, lw) {
  ctx.setLineDash([]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(W - 8, y); ctx.stroke();
}
function hlineDash(ctx, y, W, color, lw) {
  ctx.setLineDash([5, 9]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(W - 8, y); ctx.stroke();
  ctx.setLineDash([]);
}

function repaintDraw(W, H) {
  drX.clearRect(0, 0, W, H);
  // Offscreen auf drawCanvas projizieren
  drX.drawImage(offscreen, 0, 0, offscreen.width, offscreen.height, 0, 0, W, H);
}

/* ── Vorgabe-Satz als Druckschrift auf Linien rendern ── */
function renderVorgabe(satz) {
  const outer = document.getElementById('vorgabeOuter');
  const vc    = document.getElementById('vorgabeCanvas');
  const W     = outer.clientWidth || 600;

  /* Druckschrift-Einstellungen:
     - Noto Sans = aufrechte, serifenlose Einzelbuchstaben
     - Kein Italic, kein Bold → reiner Grundschrift-Charakter
     - Buchstabengröße: 36px = typische Größe auf 4-Linien-Heft */
  const FONT_SIZE = Math.min(36, W * 0.048);
  const LINE_H_V  = FONT_SIZE * 2.6;
  const PAD_V     = FONT_SIZE * 0.9;

  // Font laden und dann zeichnen
  const font = `${FONT_SIZE}px 'Noto Sans', Arial, sans-serif`;

  // Temporär messen
  const tmpC = document.createElement('canvas');
  const tmpX = tmpC.getContext('2d');
  tmpX.font  = font;

  // Wörter umbrechen
  const words   = satz.split(' ');
  const maxW    = W - 36;
  let lines     = [];
  let cur       = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (tmpX.measureText(test).width > maxW && cur) {
      lines.push(cur); cur = w;
    } else { cur = test; }
  });
  if (cur) lines.push(cur);

  const H = lines.length * LINE_H_V + PAD_V * 2;

  vc.width  = Math.round(W * dpr);
  vc.height = Math.round(H * dpr);
  vc.style.width  = W + 'px';
  vc.style.height = H + 'px';

  const vx = vc.getContext('2d');
  vx.setTransform(1,0,0,1,0,0);
  vx.scale(dpr, dpr);

  // Hintergrund
  vx.fillStyle = '#f7fbff';
  vx.fillRect(0, 0, W, H);

  lines.forEach((ln, i) => {
    const y0     = PAD_V + i * LINE_H_V;
    const base   = y0 + LINE_H_V * 0.65; // Grundlinie
    const top    = y0 + LINE_H_V * 0.08;
    const mid    = y0 + LINE_H_V * 0.37;
    const bottom = y0 + LINE_H_V * 0.91;

    // Linien zeichnen
    hline(vx, top,    W, 'rgba(100,160,225,0.45)', 0.9);
    hlineDash(vx, mid, W, 'rgba(100,160,225,0.25)', 0.8);
    hline(vx, base,   W, 'rgba(210,130,55,0.80)',  3.0);
    hline(vx, bottom, W, 'rgba(100,160,225,0.28)', 0.8);

    // Text auf Grundlinie
    vx.font      = font;
    vx.fillStyle = '#1a2e4a';
    vx.textBaseline = 'alphabetic';
    // Leicht erhöhter Zeichenabstand für Druckschrift-Charakter
    vx.letterSpacing = '0.04em';
    vx.fillText(ln, 18, base);
  });
}

/* ══════════════════════════════════════════════════
   ZEICHNEN – Apple Pencil / Touch / Maus
══════════════════════════════════════════════════ */
function getEvPos(e) {
  const rect = drC.getBoundingClientRect();
  let x, y, pressure = 0.5;
  if (e.changedTouches && e.changedTouches.length) {
    const t = e.changedTouches[0];
    x = t.clientX - rect.left;
    y = t.clientY - rect.top;
    if (t.force > 0) pressure = t.force;
  } else {
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
    if (e.pressure > 0) pressure = e.pressure;
  }
  return { x, y, pressure: Math.max(0.1, Math.min(1, pressure)) };
}

function onDown(e) {
  e.preventDefault();
  e.stopPropagation();
  drawing = true;
  const p = getEvPos(e);
  lastX = p.x; lastY = p.y; lastPressure = p.pressure;
  hasContent = true;
  document.getElementById('hint').style.display = 'none';
  if (e.pointerId != null) {
    try { drC.setPointerCapture(e.pointerId); } catch(_) {}
  }
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  e.stopPropagation();
  const p = getEvPos(e);

  // In Offscreen-Canvas malen (bleibt erhalten!)
  const prs = p.pressure;
  const lw  = penSize * (0.55 + prs * 0.95);
  offCtx.lineJoin     = 'round';
  offCtx.lineCap      = 'round';
  offCtx.strokeStyle  = `rgba(20,35,60,${0.48 + prs * 0.52})`;
  offCtx.lineWidth    = lw;
  offCtx.beginPath();
  offCtx.moveTo(lastX, lastY);
  offCtx.lineTo(p.x, p.y);
  offCtx.stroke();

  lastX = p.x; lastY = p.y; lastPressure = prs;

  // drawCanvas neu rendern (nur offscreen projizieren, Linien bleiben im bgCanvas)
  const W = wrap.clientWidth;
  const H = parseInt(drC.style.height) || wrap.clientHeight;
  drX.clearRect(0, 0, W, H);
  drX.drawImage(offscreen, 0, 0, offscreen.width, offscreen.height, 0, 0, W, H);
}

function onUp(e) {
  drawing = false;
  if (e.pointerId != null) {
    try { drC.releasePointerCapture(e.pointerId); } catch(_) {}
  }
}

// Pointer Events (iPadOS ≥ 13.4 mit Pencil)
drC.addEventListener('pointerdown',   onDown, { passive: false });
drC.addEventListener('pointermove',   onMove, { passive: false });
drC.addEventListener('pointerup',     onUp,   { passive: false });
drC.addEventListener('pointercancel', onUp,   { passive: false });

// Touch Events (Fallback + ältere iPadOS)
drC.addEventListener('touchstart', onDown, { passive: false });
drC.addEventListener('touchmove',  onMove, { passive: false });
drC.addEventListener('touchend',   onUp,   { passive: false });

// Maus (Desktop-Test)
drC.addEventListener('mousedown', onDown, { passive: false });
drC.addEventListener('mousemove', onMove, { passive: false });
drC.addEventListener('mouseup',   onUp   );

// Wrapper: Scroll blockieren beim Zeichnen
wrap.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ── Stiftstärke ── */
function setPen(s) {
  penSize = s;
  document.querySelectorAll('.sz').forEach(b =>
    b.classList.toggle('on', parseFloat(b.dataset.s) === s));
}

/* ── Löschen ── */
function clearDraw() {
  const W = wrap.clientWidth;
  const H = parseInt(drC.style.height) || ROW_H * ROWS + PAD * 2;
  offCtx.clearRect(0, 0, W + 4, H + 4);
  drX.clearRect(0, 0, W, H);
  hasContent = false;
  document.getElementById('hint').style.display = 'flex';
  document.getElementById('resultCard').style.display = 'none';
}

/* ══════════════════════════════════════════════════
   SATZ LADEN / FORTSCHRITT
══════════════════════════════════════════════════ */
function loadSentence() {
  clearDraw();
  // Kurz warten bis Layout da, dann Vorgabe rendern
  requestAnimationFrame(() => renderVorgabe(SAETZE[satzIdx % SAETZE.length]));
  updateProgress();
}

function updateProgress() {
  const pct = Math.min(doneCount / 10 * 100, 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent = `${doneCount} / 10`;
}

function nextSentence() {
  satzIdx++; doneCount++;
  document.getElementById('resultCard').style.display = 'none';
  loadSentence();
}

/* ══════════════════════════════════════════════════
   AUSWERTUNG – komplett lokal im Browser
   (Tesseract.js OCR + Textvergleich)
══════════════════════════════════════════════════ */

/* Levenshtein-Distanz für unscharfen Wortvergleich */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

/* Bestes Alignment zweier Wortlisten (einfaches DP) –
   gibt Array von Paaren [vorgabeWort|null, geschriebenesWort|null] */
function alignWords(va, ga) {
  const m = va.length, n = ga.length;
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++) {
      const cost = va[i-1].toLowerCase() === ga[j-1].toLowerCase() ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  // Backtrack
  const pairs = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + (va[i-1].toLowerCase()===ga[j-1].toLowerCase()?0:1)) {
      pairs.push([va[--i], ga[--j]]);
    } else if (i > 0 && dp[i][j] === dp[i-1][j] + 1) {
      pairs.push([va[--i], null]);
    } else {
      pairs.push([null, ga[--j]]);
    }
  }
  return pairs.reverse();
}

/* ── Hauptfunktion: Überprüfen-Button ── */
async function checkWriting() {
  if (!hasContent) { alert('Bitte zuerst schreiben! ✏️'); return; }

  const btn = document.getElementById('checkBtn');
  btn.textContent = '🔍 Schrift wird gelesen…';
  await new Promise(r => setTimeout(r, 30));
  btn.disabled = true;

  /* Sauberes Bild: nur Handschrift auf Weiß (ohne Hilfslinien) */
  const W = wrap.clientWidth;
  const H = parseInt(drC.style.height) || ROW_H * ROWS + PAD * 2;
  const exp = document.createElement('canvas');
  exp.width  = Math.round(W * dpr);
  exp.height = Math.round(H * dpr);
  const ex = exp.getContext('2d');
  ex.scale(dpr, dpr);
  ex.fillStyle = '#ffffff';
  ex.fillRect(0, 0, W, H);
  ex.drawImage(offscreen, 0, 0, offscreen.width, offscreen.height, 0, 0, W, H);

  const satz = SAETZE[satzIdx % SAETZE.length];

  let result;
  try {
    result = await recognizeAndCompare(satz, exp, btn);
  } catch (e) {
    console.error('OCR-Fehler:', e);
    /* Tesseract hat nicht funktioniert → visuelle Analyse als Fallback */
    try {
      result = analyzeVisually(satz, exp, W, H);
    } catch (_) {
      result = fallback(e.message || '');
    }
  }

  showResult(result);
  btn.textContent = '🔍 Überprüfen';
  btn.disabled = false;
}

/* ── Tesseract OCR + lokaler Vergleich ── */
async function recognizeAndCompare(vorgabe, canvas, btn) {
  /* Prüfe ob Tesseract überhaupt geladen wurde */
  if (typeof Tesseract === 'undefined') {
    throw new Error('Tesseract.js konnte nicht vom CDN geladen werden.');
  }

  /* Schritt 1 – Tesseract-Worker starten mit expliziten Pfaden */
  btn.textContent = '🔤 Lade Texterkennung…';

  /* Timeout: nach 30 Sek. abbrechen */
  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('Zeitüberschreitung beim Laden der Texterkennung.')), 30000));

  const createW = Tesseract.createWorker('deu', 1, {
    workerPath : 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath   : 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    langPath   : 'https://tessdata.projectnaptha.com/4.0.0',
    logger     : m => {
      if (m.status === 'loading tesseract core')
        btn.textContent = '⚙️ Lade OCR-Engine…';
      else if (m.status === 'loading language traineddata')
        btn.textContent = '🔤 Lade deutsche Sprachdaten…';
      else if (m.status === 'initializing tesseract')
        btn.textContent = '⚙️ Initialisiere…';
      else if (m.status === 'recognizing text')
        btn.textContent = '🔍 Erkenne Schrift…';
    }
  });

  const worker = await Promise.race([createW, timeout]);

  /* Schritt 2 – OCR auf dem Canvas */
  btn.textContent = '🔍 Schrift wird erkannt…';

  let data;
  try {
    const ret = await worker.recognize(canvas);
    data = ret.data;
  } finally {
    await worker.terminate();
  }

  let geschrieben = (data.text || '').trim()
    .replace(/\n+/g, ' ')
    .replace(/\s+/g, ' ');

  /* Typische OCR-Korrekturen für deutsche Handschrift */
  geschrieben = geschrieben
    .replace(/[|]/g, 'l')
    .replace(/0(?=[a-zäöü])/g, 'o')
    .replace(/1(?=[a-zäöü])/g, 'l');

  /* Nichts erkannt? → eigene Meldung */
  if (!geschrieben || geschrieben.length < 2) {
    return {
      score: 0, emoji: '🤔',
      titel: 'Schrift nicht erkannt',
      untertitel: 'Die Texterkennung konnte deine Buchstaben leider nicht lesen.',
      punkte: [
        { typ: 'error', text: 'Deine Buchstaben konnten nicht erkannt werden. Versuche, deutlicher und etwas größer zu schreiben.' },
        { typ: 'warn',  text: 'Tipp: Schreibe jeden Buchstaben einzeln und klar auf die orangene Grundlinie.' },
        { typ: 'ok',    text: 'Nicht aufgeben – probiere es noch einmal!' }
      ]
    };
  }

  /* Schritt 3 – Vergleich */
  btn.textContent = '📝 Wird verglichen…';
  return compareTexts(vorgabe, geschrieben);
}

/* ══════════════════════════════════════════════════
   VISUELLE ANALYSE (Fallback wenn Tesseract nicht lädt)
   Vergleicht Schreibfläche rein pixelbasiert –
   keine echte OCR, aber nützliches Feedback.
══════════════════════════════════════════════════ */
function analyzeVisually(vorgabe, canvas, W, H) {
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = imgData.data;

  /* Zähle dunkle Pixel (Tinte) */
  let inkPixels = 0;
  const totalPixels = canvas.width * canvas.height;
  for (let i = 0; i < px.length; i += 4) {
    const brightness = px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114;
    if (brightness < 120) inkPixels++;
  }
  const inkRatio = inkPixels / totalPixels;

  /* Erwartete Wortanzahl → erwartete ungefähre Tintenabdeckung */
  const wordCount  = vorgabe.split(/\s+/).length;
  const charCount  = vorgabe.replace(/\s/g, '').length;

  /* Zeilen-Analyse: prüfe ob in jeder erwarteten Zeile Tinte ist */
  const rowH = Math.round(canvas.height / ROWS);
  const rowInk = [];
  for (let r = 0; r < ROWS; r++) {
    let count = 0;
    const y0 = r * rowH;
    const y1 = Math.min((r + 1) * rowH, canvas.height);
    for (let y = y0; y < y1; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const idx = (y * canvas.width + x) * 4;
        const br = px[idx] * 0.299 + px[idx+1] * 0.587 + px[idx+2] * 0.114;
        if (br < 120) count++;
      }
    }
    rowInk.push(count);
  }

  /* Wörter-Spalten: zähle Lücken im Tintenprofil (grobe Wortanzahl) */
  const colBins = 100;
  const binW = Math.floor(canvas.width / colBins);
  const colInk = new Array(colBins).fill(0);
  for (let b = 0; b < colBins; b++) {
    const x0 = b * binW;
    const x1 = Math.min(x0 + binW, canvas.width);
    for (let y = 0; y < canvas.height; y++) {
      for (let x = x0; x < x1; x++) {
        const idx = (y * canvas.width + x) * 4;
        const br = px[idx] * 0.299 + px[idx+1] * 0.587 + px[idx+2] * 0.114;
        if (br < 120) colInk[b]++;
      }
    }
  }
  const threshold = Math.max(...colInk) * 0.05;
  let estimatedWords = 0;
  let inWord = false;
  for (let b = 0; b < colBins; b++) {
    if (colInk[b] > threshold && !inWord)  { estimatedWords++; inWord = true; }
    if (colInk[b] <= threshold && inWord) { inWord = false; }
  }

  /* Feedback zusammenbauen */
  const punkte = [];
  let score = 100;

  /* 1. Tintenmenge */
  if (inkRatio < 0.001) {
    punkte.push({ typ: 'error', text: 'Es wurde fast nichts geschrieben. Schreibe den ganzen Satz ab!' });
    score -= 50;
  } else if (inkRatio < 0.005) {
    punkte.push({ typ: 'warn', text: 'Es wurde relativ wenig geschrieben – fehlen vielleicht Wörter?' });
    score -= 20;
  } else {
    punkte.push({ typ: 'ok', text: 'Du hast gut sichtbar geschrieben.' });
  }

  /* 2. Geschätzte Wortanzahl */
  const wordDiff = Math.abs(estimatedWords - wordCount);
  if (wordDiff <= 1) {
    punkte.push({ typ: 'ok', text: `Die Wortanzahl sieht passend aus (ungefähr ${estimatedWords} erkannt, ${wordCount} erwartet).` });
  } else if (estimatedWords < wordCount) {
    punkte.push({ typ: 'warn', text: `Es scheinen Wörter zu fehlen (ungefähr ${estimatedWords} erkannt, ${wordCount} erwartet).` });
    score -= 10 * wordDiff;
  } else {
    punkte.push({ typ: 'warn', text: `Es wurden mehr Wörter erkannt als erwartet (ungefähr ${estimatedWords} statt ${wordCount}).` });
    score -= 5;
  }

  /* 3. Zeilenverteilung */
  const usedRows = rowInk.filter(c => c > 50).length;
  if (usedRows >= 1) {
    punkte.push({ typ: 'ok', text: `Deine Schrift verteilt sich auf ${usedRows} Zeile${usedRows > 1 ? 'n' : ''}.` });
  }

  /* 4. Hinweis zur eingeschränkten Analyse */
  punkte.push({ typ: 'warn', text: 'Hinweis: Die vollständige Texterkennung konnte nicht geladen werden. Diese Auswertung basiert nur auf der Bildanalyse und kann den Inhalt nicht lesen. Bitte lass eine Lehrerin oder einen Erwachsenen deinen Text prüfen!' });

  score = Math.max(0, Math.min(100, score));

  let emoji, titel, untertitel;
  if (score >= 80) {
    emoji = '👍'; titel = 'Sieht gut aus!';
    untertitel = 'Die Schrift sieht ordentlich aus – lass den Inhalt am besten von jemandem prüfen.';
  } else if (score >= 50) {
    emoji = '💪'; titel = 'Guter Versuch!';
    untertitel = 'Schau dir die Hinweise an und versuche es noch einmal.';
  } else {
    emoji = '🤔'; titel = 'Noch einmal versuchen';
    untertitel = 'Schreibe langsam und deutlich – du schaffst das!';
  }

  return { score, emoji, titel, untertitel, punkte };
}

/* ── Lokaler Textvergleich ── */
function compareTexts(vorgabe, geschrieben) {
  const punkte = [];
  let score = 100;

  /* Was wurde erkannt? */
  punkte.push({ typ: 'ok', text: `Ich habe gelesen: »${geschrieben}«` });

  /* Normalisierung für Wortvergleich */
  const stripPunct = s => s.replace(/[.,!?;:]+$/g, '').trim();
  const wordsV = stripPunct(vorgabe).split(/\s+/);
  const wordsG = stripPunct(geschrieben).split(/\s+/);

  /* Alignment der Wortlisten */
  const pairs = alignWords(wordsV, wordsG);

  let correctWords  = 0;
  let spellingErrors = [];
  let caseErrors     = [];
  let missingWords   = [];
  let extraWords     = [];

  pairs.forEach(([wV, wG]) => {
    if (wV && !wG) {
      missingWords.push(wV);
      score -= 15;
      return;
    }
    if (!wV && wG) {
      extraWords.push(wG);
      score -= 10;
      return;
    }

    /* Beide vorhanden → vergleichen */
    const dist = levenshtein(wV.toLowerCase(), wG.toLowerCase());

    if (dist === 0) {
      /* Inhaltlich gleich → Groß-/Kleinschreibung prüfen */
      correctWords++;
      if (wV !== wG) {
        if (wV[0] !== wG[0]) {
          if (wV[0] === wV[0].toUpperCase()) {
            caseErrors.push(`„${wG}" muss großgeschrieben werden → „${wV}"`);
            score -= 10;
          } else {
            caseErrors.push(`„${wG}" wird kleingeschrieben → „${wV}"`);
            score -= 10;
          }
        }
      }
    } else if (dist <= Math.max(2, Math.floor(wV.length * 0.4))) {
      /* Ähnlich genug = Tippfehler / Rechtschreibfehler */
      spellingErrors.push(`„${wV}" wurde als „${wG}" geschrieben`);
      score -= 15;
    } else {
      /* Sehr verschieden – möglicherweise OCR-Fehler */
      spellingErrors.push(`„${wV}" wurde als „${wG}" erkannt – bitte prüfe dieses Wort`);
      score -= 15;
    }
  });

  /* Fehlende Wörter */
  if (missingWords.length > 0) {
    missingWords.forEach(w =>
      punkte.push({ typ: 'error', text: `Wort fehlt: „${w}"` }));
  }
  /* Zusätzliche Wörter */
  if (extraWords.length > 0) {
    extraWords.forEach(w =>
      punkte.push({ typ: 'error', text: `Zusätzliches Wort: „${w}"` }));
  }
  /* Rechtschreibfehler */
  if (spellingErrors.length > 0) {
    spellingErrors.forEach(e => punkte.push({ typ: 'error', text: e }));
  }
  /* Groß-/Kleinschreibung */
  if (caseErrors.length > 0) {
    caseErrors.forEach(e => punkte.push({ typ: 'error', text: e }));
  } else if (correctWords > 0) {
    punkte.push({ typ: 'ok', text: 'Groß- und Kleinschreibung ist korrekt.' });
  }

  /* Richtige Wörter zusammenfassen */
  if (correctWords > 0) {
    punkte.push({ typ: 'ok', text: `${correctWords} von ${wordsV.length} Wörtern richtig erkannt.` });
  }

  /* Satzzeichen */
  const lastCharV = vorgabe.trim().slice(-1);
  const lastCharG = geschrieben.trim().slice(-1);
  if ('.!?'.includes(lastCharV)) {
    if (lastCharG === lastCharV) {
      punkte.push({ typ: 'ok', text: 'Satzzeichen am Ende ist korrekt.' });
    } else if (!'.!?'.includes(lastCharG)) {
      punkte.push({ typ: 'error', text: 'Der Punkt am Satzende fehlt.' });
      score -= 5;
    }
  }

  /* Hinweis zur Browser-Erkennung */
  punkte.push({ typ: 'warn', text: 'Hinweis: Die Erkennung läuft automatisch im Browser und kann Fehler machen. Lass am besten eine Lehrerin oder einen Erwachsenen drüberschauen!' });

  score = Math.max(0, Math.min(100, score));

  let emoji, titel, untertitel;
  if (score >= 90) {
    emoji = '🌟'; titel = 'Super geschrieben!';
    untertitel = 'Das sieht richtig toll aus – weiter so!';
  } else if (score >= 70) {
    emoji = '👍'; titel = 'Gut gemacht!';
    untertitel = 'Nur ein paar Kleinigkeiten – du bist auf dem richtigen Weg!';
  } else if (score >= 50) {
    emoji = '💪'; titel = 'Guter Versuch!';
    untertitel = 'Schau dir die Hinweise an und probiere es noch einmal.';
  } else {
    emoji = '🤔'; titel = 'Noch einmal versuchen';
    untertitel = 'Schreibe langsam und deutlich – du schaffst das!';
  }

  return { score, emoji, titel, untertitel, punkte };
}

/* ── Fallback: wenn Tesseract nicht geladen werden kann ── */
function fallback(errorMsg) {
  const detail = errorMsg
    ? `Fehlerdetail: ${errorMsg}`
    : 'Bitte prüfe deine Internetverbindung und versuche es erneut.';
  return {
    score: 0, emoji: '⚠️',
    titel: 'Schrifterkennung nicht verfügbar',
    untertitel: 'Sowohl die Texterkennung als auch die Bildanalyse konnten nicht ausgeführt werden.',
    punkte: [
      { typ: 'error', text: `Die Texterkennung konnte nicht geladen werden. ${detail}` },
      { typ: 'warn',  text: 'Tipp: Die Seite muss über einen Webserver aufgerufen werden (nicht als lokale Datei), damit die Erkennung funktioniert. Alternativ einfach den Text von einer Lehrerin prüfen lassen.' },
      { typ: 'ok',    text: 'Du kannst trotzdem weiterüben – Übung macht den Meister!' },
    ]
  };
}

function showResult(r) {
  const card  = document.getElementById('resultCard');
  const badge = document.getElementById('scoreBadge');
  const title = document.getElementById('scoreTitle');
  const sub   = document.getElementById('scoreSub');
  const list  = document.getElementById('fbList');

  badge.textContent = r.emoji || '👍';
  badge.className   = 'score-badge ' + (r.score >= 80 ? 's-great' : r.score >= 55 ? 's-ok' : 's-low');
  title.textContent = r.titel;
  sub.textContent   = r.untertitel;

  list.innerHTML = '';
  (r.punkte || []).forEach(p => {
    const li  = document.createElement('li');
    const cls = p.typ === 'ok' ? 'fb-ok' : p.typ === 'warn' ? 'fb-warn' : 'fb-err';
    const ico = p.typ === 'ok' ? '✅' : p.typ === 'warn' ? '⚠️' : '❌';
    li.className = 'fb-item ' + cls;
    li.innerHTML = `<span class="fb-ico">${ico}</span><span>${p.text}</span>`;
    list.appendChild(li);
  });

  card.style.display = 'block';
  setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 60);
}
