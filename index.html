<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lese-Verständnis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Tahoma, sans-serif;
    background: linear-gradient(135deg, #fef3c7 0%, #c7f5d3 50%, #cfe9ff 100%);
    min-height: 100vh;
    color: #2b2b2b;
    padding: 20px;
  }
  .app {

    color: #2563eb;
    margin-bottom: 6px;

  }
  .subtitle {

    color: #555;
    margin-bottom: 22px;
    font-size: 1.05rem;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Start screen */
  .text-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .text-card {
    background: #f3f8ff;
    border: 2px solid #cfe2ff;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    font-size: 1rem;
    color: #1e3a8a;
    font-weight: 600;
  }
  .text-card:hover {
    background: #e0eeff;
    transform: translateY(-2px);
    border-color: #60a5fa;
  }
  .text-card .topic {
    display: block;
    font-size: 0.78rem;
    color: #666;
    font-weight: 400;
    margin-top: 4px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
  }
  button.primary {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.18s;
  }
  button.primary:hover { background: #1d4ed8; }
  button.secondary {
    background: #e5e7eb;
    color: #1f2937;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.18s;
  }
  button.secondary:hover { background: #d1d5db; }

  /* Reading screen */
  .text-title {
    font-size: 1.5rem;
    color: #1e3a8a;
    margin-bottom: 14px;
    text-align: center;
  }
  .reading-text {
    font-size: 1.08rem;
    line-height: 1.65;
    background: #fffdf6;
    border: 1px solid #f0e7c8;
    padding: 22px 26px;
    border-radius: 12px;
    margin-bottom: 18px;
    white-space: pre-line;
  }
  .reading-text p { margin-bottom: 12px; }

  /* Question screen */
  .progress {
    text-align: center;
    color: #555;
    margin-bottom: 12px;
    font-size: 0.95rem;
  }
  .question {
    font-size: 1.2rem;
    font-weight: 600;
    color: #1f2937;
    margin-bottom: 16px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    text-align: left;
    font-size: 1rem;

    border-color: #93c5fd;
  }

    border-color: #16a34a;
    background: #dcfce7;
    color: #14532d;
    font-weight: 600;
  }

    border-color: #dc2626;
    background: #fee2e2;
    color: #7f1d1d;
  }
  .option.disabled { cursor: default; }

    margin: 14px 0;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 600;
    text-align: center;
    font-size: 1.05rem;
  }

    background: #dcfce7;
    color: #14532d;
    border: 2px solid #86efac;
  }
  .feedback.wrong {
    background: #fee2e2;
    color: #7f1d1d;
    border: 2px solid #fca5a5;
  }

  .result-card {
    text-align: center;
    padding: 30px 20px;
  }
  .result-emoji {
    font-size: 4rem;
    margin-bottom: 10px;
  }
  .result-score {
    font-size: 1.6rem;
    color: #1e3a8a;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .result-message {
    font-size: 1.1rem;
    color: #444;
    margin-bottom: 22px;
  }
  .stars {
    font-size: 2.2rem;
    margin: 10px 0 18px;
    letter-spacing: 6px;
  }
  .star-on { color: #fbbf24; }
  .star-off { color: #d1d5db; }

  @media (max-width: 600px) {
    .app { padding: 18px; }
    h1 { font-size: 1.5rem; }
    .reading-text { padding: 16px; font-size: 1rem; }
    .text-title { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Lese-Verständnis</h1>
  <p class="subtitle">Lies den Text in Ruhe — danach beantworte die Fragen.</p>

  <!-- Start Screen -->
  <div id="screen-start" class="screen active">
    <div class="actions">
      <button class="primary" onclick="startRandom()">Zufälligen Text starten</button>
    </div>
    <h3 style="margin-top: 26px; color: #374151;">Oder wähle einen Text:</h3>
    <div class="text-list" id="textList"></div>
  </div>

  <!-- Reading Screen -->
  <div id="screen-reading" class="screen">
    <h2 class="text-title" id="readingTitle"></h2>
    <div class="reading-text" id="readingContent"></div>
    <div class="actions">
      <button class="secondary" onclick="goHome()">Zurück</button>
      <button class="primary" onclick="startQuestions()">Ich bin fertig — Fragen beantworten</button>
    </div>
  </div>

  <!-- Question Screen -->
  <div id="screen-question" class="screen">
    <div class="progress" id="progress"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
    <div class="actions">
      <button class="secondary" onclick="rereadText()">Text noch mal lesen</button>
      <button class="primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">Weiter</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="stars" id="resultStars"></div>
      <div class="result-message" id="resultMessage"></div>
      <div class="actions">
        <button class="primary" onclick="goHome()">Zur Übersicht</button>
        <button class="secondary" onclick="startRandom()">Nächster Text</button>
      </div>
    </div>
  </div>
</div>

    text: `Der Regenwald ist einer der spannendsten Orte der Welt. Hier ist es das ganze Jahr über warm und feucht. Es regnet sehr oft — manchmal jeden Tag. Deshalb wachsen dort riesige Bäume und sehr viele verschiedene Pflanzen.

    text: `Es war ein sonniger Samstagmorgen, als Mia auf dem Dachboden ihrer Großeltern eine alte Holzkiste entdeckte. Sie hob den Deckel — und in der Kiste lag ein vergilbtes Stück Papier. Eine Schatzkarte!

Auf der Karte waren ein großer Baum, ein Bach und ein Stein mit einem roten Kreuz eingezeichnet. „Das muss der Garten von Opa sein!", flüsterte Mia aufgeregt. Schnell rannte sie zu ihrem besten Freund Leo. Zusammen wollten sie den Schatz finden.

    text: `Tief unter der Erdoberfläche ist es richtig heiß. Dort gibt es geschmolzenes Gestein, das man Magma nennt. Manchmal findet das Magma einen Weg nach oben — durch einen Riss oder eine Öffnung in der Erdkruste. Wenn es ausbricht, sprechen wir von einem Vulkan.

    text: `Vor mehr als 1000 Jahren lebten in Nordeuropa die Wikinger. Ihre Heimat war hauptsächlich das, was wir heute Norwegen, Schweden und Dänemark nennen. Die Wikinger waren mutige Seefahrer, geschickte Handwerker und manchmal auch gefürchtete Krieger.

  {
    title: "Die Sonne — unser nächster Stern",
    topic: "Wissen",
    text: `Wenn du tagsüber nach draußen gehst, siehst du sie meistens am Himmel: die Sonne. Sie wirkt wie ein heller Ball — aber in Wirklichkeit ist die Sonne ein riesiger Stern. Sie ist nur deshalb so groß und hell zu sehen, weil sie näher an uns dran ist als alle anderen Sterne.

Die Sonne ist eine gewaltige Kugel aus glühend heißen Gasen. An ihrer Oberfläche ist es etwa 5500 Grad heiß. Im Inneren wird es noch viel heißer — bis zu 15 Millionen Grad. Solche Temperaturen können wir uns kaum vorstellen.

let state = {
  currentText: null,

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function buildTextList() {
  const list = document.getElementById('textList');
  list.innerHTML = '';
  TEXTS.forEach((t, i) => {
    const card = document.createElement('button');
    card.className = 'text-card';
    card.innerHTML = `${t.title}<span class="topic">${t.topic}</span>`;
    card.onclick = () => openText(i);
    list.appendChild(card);
  });
}

function openText(index) {
  state.currentText = index;
  state.qIndex = 0;
  state.score = 0;
  state.answered = false;
  const t = TEXTS[index];
  document.getElementById('readingTitle').textContent = t.title;
  document.getElementById('readingContent').textContent = t.text;
  showScreen('screen-reading');
}

function startRandom() {
  const i = Math.floor(Math.random() * TEXTS.length);
  openText(i);
}

function startQuestions() {
  state.qIndex = 0;
  state.score = 0;
  showQuestion();
  showScreen('screen-question');
}

function rereadText() {
  showScreen('screen-reading');
}

function showQuestion() {
  const t = TEXTS[state.currentText];
  const q = t.questions[state.qIndex];
  state.answered = false;
  document.getElementById('progress').textContent = `Frage ${state.qIndex + 1} von ${t.questions.length}`;
  document.getElementById('questionText').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = () => answer(i, b);
    optsDiv.appendChild(b);
  });
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
}

function answer(chosen, btn) {
  if (state.answered) return;
  state.answered = true;
  const t = TEXTS[state.currentText];
  const q = t.questions[state.qIndex];
  const allBtns = document.querySelectorAll('#options .option');
  allBtns.forEach((b, i) => {
    b.classList.add('disabled');
    if (i === q.correct) b.classList.add('correct');
    if (i === chosen && chosen !== q.correct) b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  if (chosen === q.correct) {
    state.score++;
    fb.className = 'feedback right';
    fb.textContent = 'Richtig! Sehr gut!';
    playGoodSound();
  } else {
    fb.className = 'feedback wrong';
    fb.textContent = 'Leider falsch. Die richtige Antwort ist markiert.';
  }
  const isLast = state.qIndex === t.questions.length - 1;
  const next = document.getElementById('nextBtn');
  next.textContent = isLast ? 'Ergebnis sehen' : 'Weiter';
  next.style.display = 'inline-block';
}

function nextQuestion() {
  const t = TEXTS[state.currentText];
  if (state.qIndex < t.questions.length - 1) {
    state.qIndex++;
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const t = TEXTS[state.currentText];
  const total = t.questions.length;
  const score = state.score;
  document.getElementById('resultScore').textContent = `${score} von ${total} richtig`;

  // stars: 1, 2 or 3
  let stars;
  if (score === total) stars = 3;
  else if (score >= Math.ceil(total / 2)) stars = 2;
  else if (score > 0) stars = 1;
  else stars = 0;

  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    starsHtml += `<span class="${i < stars ? 'star-on' : 'star-off'}">★</span>`;
  }
  document.getElementById('resultStars').innerHTML = starsHtml;

  let emoji, msg;
  if (score === total) {
    emoji = '🎉';
    msg = 'Super gemacht! Du hast alle Fragen richtig beantwortet.';
    playFanfare();
  } else if (score >= Math.ceil(total / 2)) {
    emoji = '😊';
    msg = 'Gut gemacht! Lies den Text gerne noch einmal und versuche es wieder.';
  } else {
    emoji = '📖';
    msg = 'Kein Problem. Versuche, den Text noch einmal in Ruhe zu lesen.';
  }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMessage').textContent = msg;

  showScreen('screen-result');
}

function goHome() {
  showScreen('screen-start');
}

// Sounds via Web Audio API
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  }
  return audioCtx;
}
function playTone(freq, start, dur, vol = 0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.value = freq;
  o.type = 'triangle';
  g.gain.setValueAtTime(0, ctx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
  o.connect(g).connect(ctx.destination);
  o.start(ctx.currentTime + start);
  o.stop(ctx.currentTime + start + dur + 0.05);
}
function playGoodSound() {
  playTone(660, 0, 0.15);
  playTone(880, 0.12, 0.20);
}
function playFanfare() {
  playTone(523, 0.00, 0.18);  // C
  playTone(659, 0.18, 0.18);  // E
  playTone(784, 0.36, 0.18);  // G
  playTone(1047, 0.54, 0.35); // C
}

buildTextList();
